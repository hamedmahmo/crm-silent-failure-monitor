[project]
name = "crm-silent-failure-monitor"
version = "0.1.0"
description = "Snapshots CRM data into DuckDB, runs SQL checks for data problems that break reporting without errors, and reports what changed since the last run."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=2.0.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["generate", "simulate_day2", "monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["data", "."]
addopts = "-q"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
